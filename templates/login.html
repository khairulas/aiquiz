{% extends "base.html" %}

{% block content %}
    <h1>Login</h1>

    <div style="margin-bottom: 25px;">
        <p><strong>Students and staff:</strong> sign in with your UiTM Google account.</p>
        <a href="{{ url_for('login_google') }}" class="btn"
           style="background-color:#4285F4; display:block; text-align:center;">
            Sign in with UiTM Google Account
        </a>
            <p style="font-size:0.85em; color:#666; margin-top:8px;">
            Use your <strong>{{ config['UITM_DOMAINS_LABEL'] }}</strong> address.
        </p>
    </div>

    <hr>

    <details style="margin-top:20px;">
        <summary style="cursor:pointer; color:#666;">Staff login with password</summary>
        <form method="POST" action="{{ url_for('login') }}" style="margin-top:15px;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p style="margin-top:10px;">
            <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
        </p>
    </details>
{% endblock %}
